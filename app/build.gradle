plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Đọc API Key từ local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.UngDung.ThucPhamXanh'
    compileSdk 35
 
    defaultConfig {
        applicationId "com.UngDung.ThucPhamXanh"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Hỗ trợ 16 KB page size cho Android 15+ (yêu cầu Google Play từ 1/11/2025)
        // Đảm bảo native libraries được align đúng cách
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        // Cấu hình API Key OpenAI từ local.properties
        buildConfigField "String", "OPENAI_API_KEY", "\"${localProperties.getProperty('OPENAI_API_KEY') ?: ''}\""
        // API Key Gemini (chatbot) từ local.properties — không ghi thẳng key vào code
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty('GEMINI_API_KEY') ?: ''}\""
    }
    
    buildFeatures {
        buildConfig = true
    }
    
    // Cấu hình packaging để hỗ trợ 16 KB page size cho Android 15+
    // Android Gradle Plugin 8.1+ tự động xử lý 16 KB page size alignment
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Cho phép unit test gọi android.util.Log (trả về giá trị mặc định thay vì lỗi)
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Keystore debug riêng của dự án (app/debug.keystore) để mọi máy build ra cùng SHA-1.
    // SHA-1 của keystore mặc định trong ~/.android bị project Firebase cũ (appai) giữ,
    // nên Google Sign-In trên project thucphamsach phải dùng keystore này.
    // File không được đưa lên git; nếu thiếu thì build vẫn chạy bằng keystore mặc định
    // (nhưng đăng nhập Google sẽ lỗi mã 10).
    def projectDebugKeystore = file('debug.keystore')
    signingConfigs {
        debug {
            if (projectDebugKeystore.exists()) {
                storeFile projectDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // OpenStreetMap thay vì Google Maps
    implementation 'org.osmdroid:osmdroid-android:6.1.17'
    implementation 'org.jetbrains:annotations:15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    // Thư viện indicator:              https://github.com/ongakuer/CircleIndicator
    implementation 'me.relex:circleindicator:2.1.6'

    // https://github.com/hdodenhof/CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation platform('com.google.firebase:firebase-bom:31.0.0')
    implementation 'com.google.firebase:firebase-auth'
    // Đăng nhập Google & Facebook
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.facebook.android:facebook-login:16.3.0'
    implementation 'com.google.firebase:firebase-firestore' // lưu dữ liệu firebasestore
    implementation 'com.github.momo-wallet:mobile-sdk:1.0.6' // APi momo
    implementation 'com.squareup.picasso:picasso:2.71828' // Picasso xử lý các ImageView trong adapter
    implementation 'com.google.firebase:firebase-storage'
    implementation 'de.hdodenhof:circleimageview:3.1.0' // thong tin ca nhan
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'// gg map
    implementation 'com.google.android.gms:play-services-maps:18.0.0'

    // QR code https://github.com/journeyapps/zxing-android-embedded
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Phân tích
    implementation 'com.google.firebase:firebase-analytics'
    // Cơ sở dữ liệu thời gian thực
    implementation 'com.google.firebase:firebase-database:16.0.6'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.17' // Gif image

    // Retrofit call API with Chatbot
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'

    implementation 'com.github.arimorty:floatingsearchview:2.1.1'

    // Excel
    implementation 'org.apache.poi:poi:3.17'

    //import com.github.mikephil.charting.data.PieDataSet;
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}